name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (например, v1.0.0). Пусто — только сборка."
        required: false

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          NAME="${VERSION#v}"
          ./gradlew --no-daemon assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName="${NAME:-0.0.${{ github.run_number }}-dev}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/StalzoneMarket-${VERSION:-dev}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: StalzoneMarket-apk
          path: dist/*.apk

      - name: Remove existing release with the same version
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$VERSION" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true

      - uses: softprops/action-gh-release@v2
        if: env.VERSION != ''
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
